<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logo animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#eef1f6;
    --stage:#ffffff;
    --ink:#101a2d;
    --muted:#63728c;
    --line:#dde3ec;
    --chip:#ffffff;
    --chip-on:#0b5cff;
    --chip-on-ink:#ffffff;
    --shadow: 0 1px 2px rgba(16,26,45,.08), 0 12px 32px -18px rgba(16,26,45,.35);
    --floor: rgba(11,60,140,.22);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#070c16;
    --stage:#0d1524;
    --ink:#e8edf7;
    --muted:#8ea0bd;
    --line:#1d293e;
    --chip:#141e30;
    --chip-on:#2b7cff;
    --chip-on-ink:#04101f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.8);
    --floor: rgba(0,0,0,.55);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }

  /* ---------- stage ---------- */
  .stage{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    display:grid;
    place-items:center;
    background:
      radial-gradient(120% 90% at 50% 38%, var(--stage) 0%, var(--stage) 46%, transparent 100%);
    overflow:hidden;
    padding:24px;
  }
  .stage::after{ /* faint isometric floor lines, only when guides are on */
    content:"";
    position:absolute; inset:0;
    opacity:0;
    transition:opacity .35s ease;
    background:
      repeating-linear-gradient(30deg, transparent 0 39px, var(--line) 39px 40px),
      repeating-linear-gradient(-30deg, transparent 0 39px, var(--line) 39px 40px);
    -webkit-mask-image:radial-gradient(70% 60% at 50% 55%, #000 0%, transparent 78%);
            mask-image:radial-gradient(70% 60% at 50% 55%, #000 0%, transparent 78%);
    pointer-events:none;
  }
  body[data-guides="on"] .stage::after{opacity:1}

  .logo{
    --s: clamp(240px, min(62vh, 58vw), 520px);
    width:var(--s);
    height:var(--s);
    position:relative;
    will-change:transform;
  }

  .floor{
    position:absolute;
    left:12%; top:63%;
    width:76%; height:26%;
    background:radial-gradient(50% 50% at 50% 50%, var(--floor) 0%, transparent 72%);
    filter:blur(6px);
    opacity:0;
    animation:floorIn .9s .28s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes floorIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  .layer{position:absolute; transform:translate3d(var(--dx,0px), var(--dy,0px), 0); transition:transform .5s cubic-bezier(.2,.8,.3,1)}
  .bob{position:absolute; inset:0}
  .layer img{position:absolute; inset:0; width:100%; height:100%; display:block}

  .layer.base { left:0%;      top:4.227%;  width:98.565%; height:82.297%; --depth:.35 }
  .layer.glass{ left:5.183%;  top:1.675%;  width:88.118%; height:94.976%; --depth:.70 }
  .layer.top  { left:9.011%;  top:15.789%; width:87.321%; height:70.574%; --depth:1.15 }

  /* shimmer confined to the top plate silhouette */
  .sheen{
    position:absolute; inset:0;
    background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%);
    background-size:260% 100%;
    background-position:180% 0;
    mix-blend-mode:screen;
    opacity:0;
    pointer-events:none;
  }

  /* ---------- intro: assemble ---------- */
  [data-mode="assemble"] .base img{ animation:riseUp .95s .05s cubic-bezier(.16,1,.3,1) both }
  [data-mode="assemble"] .glass img{ animation:settle 1.0s .26s cubic-bezier(.16,1,.3,1) both }
  [data-mode="assemble"] .top img{ animation:dropIn 1.05s .42s cubic-bezier(.3,1.4,.5,1) both }
  [data-mode="assemble"] .sheen{ animation:sweep 1.1s 1.15s ease-in-out both }

  @keyframes riseUp{
    from{opacity:0; transform:translate3d(0, calc(var(--s)*.22), 0) scale(.94)}
    to  {opacity:1; transform:none}
  }
  @keyframes settle{
    from{opacity:0; transform:scale(.8)}
    60% {opacity:1}
    to  {opacity:1; transform:none}
  }
  @keyframes dropIn{
    from{opacity:0; transform:translate3d(0, calc(var(--s)*-.30), 0) scale(1.04)}
    to  {opacity:1; transform:none}
  }
  @keyframes sweep{
    from{opacity:0; background-position:180% 0}
    20% {opacity:.9}
    to  {opacity:0; background-position:-80% 0}
  }

  /* ---------- fan out (slides along the isometric axis) ---------- */
  [data-mode="fan"] .base img { animation:fanA 3.8s ease-in-out infinite }
  [data-mode="fan"] .glass img{ animation:fanB 3.8s ease-in-out infinite }
  [data-mode="fan"] .top img  { animation:fanC 3.8s ease-in-out infinite }
  @keyframes fanA{
    0%,12%{transform:none} 42%,58%{transform:translate3d(calc(var(--s)*-.17), calc(var(--s)*.085),0)} 88%,100%{transform:none}
  }
  @keyframes fanB{
    0%,12%{transform:none} 42%,58%{transform:translate3d(calc(var(--s)*.02), calc(var(--s)*-.01),0)} 88%,100%{transform:none}
  }
  @keyframes fanC{
    0%,12%{transform:none} 42%,58%{transform:translate3d(calc(var(--s)*.19), calc(var(--s)*-.095),0)} 88%,100%{transform:none}
  }

  /* ---------- breathe ---------- */
  [data-mode="breathe"] .base img { animation:breatheA 4.2s ease-in-out infinite }
  [data-mode="breathe"] .glass img{ animation:breatheB 4.2s ease-in-out infinite }
  [data-mode="breathe"] .top img  { animation:breatheC 4.2s ease-in-out infinite }
  @keyframes breatheA{0%,100%{transform:none} 50%{transform:translate3d(0,calc(var(--s)*.05),0)}}
  @keyframes breatheB{0%,100%{transform:none} 50%{transform:scale(1.035)}}
  @keyframes breatheC{0%,100%{transform:none} 50%{transform:translate3d(0,calc(var(--s)*-.06),0)}}

  /* ---------- always-on idle bob (separate element, so it composes) ---------- */
  .base  .bob{animation:bob 6s -0.0s ease-in-out infinite}
  .glass .bob{animation:bob 6s -2.0s ease-in-out infinite}
  .top   .bob{animation:bob 6s -4.0s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate3d(0,-.6%,0)} 50%{transform:translate3d(0,.6%,0)}}

  /* ---------- controls ---------- */
  .bar{
    flex:0 0 auto;
    display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; justify-content:center;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  .seg{display:flex; gap:4px; padding:4px; background:var(--chip); border:1px solid var(--line); border-radius:999px; box-shadow:var(--shadow)}
  button{
    font:inherit; font-weight:500; color:var(--ink);
    background:transparent; border:0; border-radius:999px;
    padding:8px 16px; cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  button:hover{background:color-mix(in srgb, var(--ink) 8%, transparent)}
  button[aria-pressed="true"]{background:var(--chip-on); color:var(--chip-on-ink)}
  button[aria-pressed="true"]:hover{background:var(--chip-on)}
  .solo{background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:9px 18px; box-shadow:var(--shadow)}
  :focus-visible{outline:2px solid var(--chip-on); outline-offset:2px}
  .hint{width:100%; text-align:center; color:var(--muted); font-size:12.5px; margin:2px 0 0}

  @media (max-width:560px){
    button{padding:8px 12px; font-size:14px}
    .bar{gap:8px}
  }
  @media (prefers-reduced-motion: reduce){
    .layer img, .bob, .floor, .sheen{animation:none !important}
    .floor{opacity:1}
    .sheen{opacity:0}
  }
</style>
</head>

  <div class="bar">
    <div class="seg" role="group" aria-label="Motion">
      <button data-mode="assemble" aria-pressed="true">Assemble</button>
      <button data-mode="fan" aria-pressed="false">Fan out</button>
      <button data-mode="breathe" aria-pressed="false">Breathe</button>
    </div>
    <button class="solo" id="replay">Replay</button>
    <button class="solo" id="guides" aria-pressed="false">Grid</button>
    <button class="solo" id="theme" aria-pressed="false">Dark</button>
    <p class="hint">Move your cursor over the stage to shift the layers. Press R to replay.</p>
  </div>

<script>
(function(){
  var logo = document.getElementById('logo');
  var stage = document.getElementById('stage');
  var modeButtons = document.querySelectorAll('.seg button');

  function play(mode){
    var parent = logo.parentNode, next = logo.nextSibling;
    parent.removeChild(logo);          // hard restart of every animation
    logo.setAttribute('data-mode', mode);
    parent.insertBefore(logo, next);
    modeButtons.forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
  }

  modeButtons.forEach(function(b){
    b.addEventListener('click', function(){ play(b.dataset.mode); });
  });
  document.getElementById('replay').addEventListener('click', function(){
    play(logo.getAttribute('data-mode'));
  });
  document.addEventListener('keydown', function(e){
    if ((e.key === 'r' || e.key === 'R') && !/input|textarea/i.test(e.target.tagName)) {
      play(logo.getAttribute('data-mode'));
    }
  });

  var guides = document.getElementById('guides');
  guides.addEventListener('click', function(){
    var on = document.body.dataset.guides === 'on';
    document.body.dataset.guides = on ? 'off' : 'on';
    guides.setAttribute('aria-pressed', String(!on));
  });

  var theme = document.getElementById('theme');
  theme.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    theme.setAttribute('aria-pressed', String(!dark));
    theme.textContent = dark ? 'Dark' : 'Light';
  });

  // cursor parallax — each plate moves by its own depth
  // clip the shimmer to the top plate's silhouette
  var sheen = document.querySelector('.sheen');
  var topImg = document.querySelector('.top img');
  if (sheen && topImg) {
    var m = 'url("' + topImg.getAttribute('src') + '")';
    sheen.style.webkitMaskImage = m;
    sheen.style.maskImage = m;
    sheen.style.webkitMaskSize = '100% 100%';
    sheen.style.maskSize = '100% 100%';
  }

  var layers = document.querySelectorAll('.layer');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var raf = null, tx = 0, ty = 0;

  function apply(){
    raf = null;
    var s = parseFloat(getComputedStyle(logo).width);
    layers.forEach(function(el){
      var d = parseFloat(getComputedStyle(el).getPropertyValue('--depth')) || 1;
      el.style.setProperty('--dx', (tx * s * 0.035 * d).toFixed(2) + 'px');
      el.style.setProperty('--dy', (ty * s * 0.020 * d).toFixed(2) + 'px');
    });
  }
  function move(e){
    if (reduce.matches) return;
    var r = stage.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width  - 0.5) * 2;
    ty = ((e.clientY - r.top)  / r.height - 0.5) * 2;
    if (!raf) raf = requestAnimationFrame(apply);
  }
  stage.addEventListener('mousemove', move);
  stage.addEventListener('mouseleave', function(){ tx = 0; ty = 0; if (!raf) raf = requestAnimationFrame(apply); });
})();
</script>
