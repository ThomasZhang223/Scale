<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room scan</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2126; }
      body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef1f4; }
      #panel {
        position: absolute; top: 16px; left: 16px; width: 290px;
        padding: 14px; border-radius: 12px; display: grid; gap: 10px;
        background: rgba(20, 23, 27, 0.86); border: 1px solid rgba(255, 255, 255, 0.08);
      }
      #panel[hidden] { display: none; }
      #connection::before {
        content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px;
        border-radius: 50%; background: #ff9f43; vertical-align: middle;
      }
      #connection[data-live="true"]::before { background: #4cd28a; }
      button {
        font: inherit; padding: 9px 12px; border-radius: 8px; cursor: pointer;
        color: inherit; background: #2d5d86; border: 1px solid #3f78a8;
      }
      button:hover { background: #356c9b; }
      button:focus-visible { outline: 2px solid #5fb3ff; outline-offset: 2px; }
      #note { color: #a9b2bc; min-height: 1.45em; }
      .row { display: flex; gap: 8px; }
      .row button:first-child { flex: 1; }
      button.quiet { background: #2a2f36; border-color: rgba(255, 255, 255, 0.15); }
      button.quiet:hover { background: #343a42; }
      .check { display: flex; align-items: center; gap: 8px; color: #cfd6dd; cursor: pointer; }
      .check input { accent-color: #4cd28a; width: 16px; height: 16px; }
      .hint { margin: 0; color: #8a96a3; font-size: 13px; }
      #catalog { display: flex; flex-wrap: wrap; gap: 6px; }
      #catalog:empty { display: none; }
      #catalog button { padding: 6px 10px; font-size: 13px; }
      #agent { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      #agent h2 { margin: 0; font-size: 13px; font-weight: 600; color: #cfd6dd; letter-spacing: 0.02em; }
      #agent .ask { display: flex; gap: 6px; }
      #agent input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; color: inherit;
        background: #14171b; border: 1px solid rgba(255, 255, 255, 0.12); }
      #agent-presets, #agent-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      #agent-presets button, #agent-buttons button { padding: 6px 10px; font-size: 13px; }
      #agent-status { color: #a9b2bc; min-height: 1.45em; }
      #agent-status[data-state="working"] { color: #5fb3ff; }
      #agent-status[data-state="proposed"] { color: #4cd28a; }
      #agent-status[data-state="failed"], #agent-status[data-state="room_changed"] { color: #ffb347; }
      #agent-log { max-height: 180px; overflow-y: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #c3cbd3; background: #14171b; border-radius: 8px; padding: 6px 8px; }
      #agent-log:empty { display: none; }
      #agent-log .warn { color: #ffd27a; }
      #agent-log .decision { color: #e8edf2; }
    </style>
  </head>
  <body>
    <div id="panel">
      <span id="connection" data-live="false">Connecting…</span>
      <div class="row">
        <button id="open" type="button">Add room or object</button>
        <button id="reset" type="button" class="quiet">Reset</button>
      </div>
      <input id="picker" type="file" accept=".json,.glb,.gltf,application/json,model/gltf-binary" multiple hidden />
      <div id="catalog"></div>
      <label class="check"><input id="colliders" type="checkbox" /> Show physics shapes</label>
      <p class="hint">Drop a room scan (.json) or scanned objects (.glb) anywhere, or add catalogue items with the buttons. Drag objects to move them; scroll while dragging to turn. In VR, pull items from the panel on your left hand.</p>
      <div id="note" role="status"></div>
      <section id="agent">
        <h2>Designer agent</h2>
        <div class="ask">
          <input id="agent-text" type="text" placeholder="e.g. Reading corner by the window" autocomplete="off" />
          <button id="agent-ask" type="button">Ask</button>
        </div>
        <div id="agent-presets"></div>
        <div id="agent-status"></div>
        <div id="agent-buttons"></div>
        <div id="agent-log" aria-live="polite"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
