# The designer agent: one Durable Object per room, built with the Cloudflare Agents SDK.
# Routes: /v1/agent/{roomId}/... (apps/xr/docs/agent/01_CONTRACT.md). Thomas's Worker can
# forward /v1/agent/* here in one line; in dev, Vite proxies it directly (port 8789).
name = "designer-agent"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "DesignerAgent"
class_name = "DesignerAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesignerAgent"]

[vars]
# Never hardcode a model in code: this is the one place it's named.
OPENAI_MODEL = "gpt-4o-mini"
# OpenAI through Cloudflare AI Gateway: https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/openai
# Empty means "call api.openai.com directly" (still logged as offline-planner if no key).
AI_GATEWAY_URL = ""
# The fit validator (services/fit) and the OR-Tools solver (services/layout, behind a Cloudflare
# Tunnel in production; a local port in dev).
FIT_URL = "http://127.0.0.1:8000"
SOLVER_URL = "http://127.0.0.1:8080"

# Secrets (wrangler secret put ..., or .dev.vars locally): OPENAI_API_KEY, SOLVER_KEY, CF_AIG_TOKEN (optional)
