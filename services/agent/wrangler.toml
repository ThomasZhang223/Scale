# The designer agent: one Durable Object per room, built with the Cloudflare Agents SDK.
# Routes: /v1/agent/{roomId}/... (apps/xr/docs/agent/01_CONTRACT.md). Thomas's Worker can
# forward /v1/agent/* here in one line; in dev, Vite proxies it directly (port 8789).
name = "designer-agent"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "DesignerAgent"
class_name = "DesignerAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesignerAgent"]

[vars]
# Never hardcode a model in code: this is the one place it's named.
OPENAI_MODEL = "gpt-4o-mini"
# OpenAI through Cloudflare AI Gateway: https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/openai
# Empty means "call api.openai.com directly" (still logged as offline-planner if no key).
AI_GATEWAY_URL = ""
# The fit container (services/fit) serves both /fit and /solve (OR-Tools); its origin is the KV
# key upstream:solver (below), not a var. Both calls carry X-Upstream-Token (the UPSTREAM_TOKEN
# secret, same value as infra/.env).

# The fit container's quick-tunnel origin, written by infra/cloudflare/set-upstreams.sh on every
# `infra/up.sh`. Same namespace as workers/wrangler.toml: a quick tunnel gets a new random
# hostname each restart, so this must be a KV read at request time, never a [vars] entry.
[[kv_namespaces]]
binding = "CONFIG"
id = "601059204ab74578a49b99ace41c9e4a"

# Secrets (wrangler secret put ..., or .dev.vars locally): OPENAI_API_KEY, UPSTREAM_TOKEN, CF_AIG_TOKEN (optional)
