# Local CPU services; GPU generation runs on Baseten. See infra/README.md.

services:
  fit:
    # Owner: Justin. Solver service — reads RoomCapture v1 and bboxMeters, answers /solve.
    build: ./services/fit
    ports:
      - "8001:8000"
    profiles: ["local"]
    restart: unless-stopped
    env_file: infra/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  embedding:
    # CPU SigLIP2 service; GPU mesh generation remains on Baseten.
    build: ./services/gen
    platform: linux/amd64 # The hashed CPU wheel lock targets x86_64.
    ports:
      - "8004:8004"
    profiles: ["local"]
    restart: unless-stopped
    env_file: infra/.env
    environment:
      EMBEDDING_CACHE_DIR: /models
      EMBEDDING_RESULT_CACHE: /data/embeddings.sqlite3
    volumes:
      - embedding-models:/models
      - embedding-results:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/ready')"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 5

  ingest:
    # Owner: Paul. Catalog scraper and extractor.
    build: ./services/ingest
    ports:
      - "8003:8080"
    profiles: ["local"]
    restart: unless-stopped
    env_file: infra/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  search:
    # Owner: Paul. Ranking service, answers /search.
    build: ./services/search
    ports:
      - "8005:8080"
    profiles: ["local"]
    restart: unless-stopped
    env_file: infra/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  embedding-models:
  embedding-results:
