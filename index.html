<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Room Scan Viewer</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1d2126;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      canvas { display: block; }
      #note {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: min(90vw, 480px);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(20, 22, 26, 0.75);
        color: #e8edf2;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
        z-index: 10;
      }
      #note:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="note"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
